[project]
name = "audio-maker"
version = "0.1.0"
description = "Turn PDFs and other documents into audiobooks with Apple voices or Chatterbox, and keep a library of them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]

[project.scripts]
audio-maker = "audio_maker.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_maker"]
